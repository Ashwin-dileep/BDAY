    <!-- Ambient Bokeh Circles -->
    <circle cx="180" cy="220" r="75" fill="#f59e0b" opacity="0.18" />
    <circle cx="440" cy="180" r="95" fill="#ec4899" opacity="0.12" />
    <circle cx="320" cy="360" r="120" fill="#e0e7ff" opacity="0.08" />
