<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <radialGradient id="candleGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="650" fill="#141416" />

  <g transform="translate(40, 50)">
    <rect width="920" height="550" fill="#0c0a09" />
    <rect width="920" height="550" fill="url(#candleGlow)" />

    <!-- Minimalist candle flame in the dark -->
    <ellipse cx="460" cy="310" rx="90" ry="120" fill="#fbbf24" opacity="0.1" />
    <path d="M460 250 C445 285 440 310 460 330 C480 310 475 285 460 250 Z" fill="#fef3c7" />
    <path d="M460 280 C452 295 450 315 460 325 C470 315 468 295 460 280 Z" fill="#f59e0b" />
    
    <!-- Candle wick and wax cylinder top -->
    <line x1="460" y1="330" x2="460" y2="345" stroke="#78716c" stroke-width="3" />
    <rect x="435" y="345" width="50" height="180" fill="#1c1917" />
    <ellipse cx="460" cy="345" rx="25" ry="8" fill="#292524" />

    <!-- Date Stamp -->
    <text x="890" y="525" font-family="'Space Mono', monospace" font-size="15" fill="#f59e0b" opacity="0.75" text-anchor="end" letter-spacing="2">
      '26 11 12
    </text>
  </g>

  <text x="50" y="32" font-family="'Space Mono', monospace" font-size="11" fill="#78716c" letter-spacing="3">
    KODAK TRI-X 400 // FRAME 05
  </text>
  <text x="950" y="32" font-family="'Space Mono', monospace" font-size="11" fill="#78716c" text-anchor="end" letter-spacing="2">
    ▶ 05A
  </text>
</svg>
